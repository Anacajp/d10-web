<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
      Add a product
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="container py-4">
    <form id="product-form">
      <label>
        Type
        <input class="form-control" name="type" required>
      </label>
      <label>
        Brand
        <input class="form-control" name="brand" required>
      </label>
      <label>
        Price
        <input class="form-control" name="price" type="number" min="0" required>
      </label>
      <label>
        Stock
        <input class="form-control" name="number" type="number" min="0" required>
      </label>
      <button class="btn btn-primary">
        Save
      </button>
    </form>
    <p id="message">
    </p>
    <script src="task06.js">
    </script>
  </body>
</html>
