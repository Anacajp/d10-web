<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
      Search products
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="container py-4">
    <form id="search-form">
      <label class="form-label">
        Type
        <input class="form-control" name="type" required>
      </label>
      <label class="form-label">
        Brand
        <input class="form-control" name="brand" required>
      </label>
      <label class="form-label">
        Price, e.g.
        &gt;
        100
        <input class="form-control" name="price" required>
      </label>
      <label class="form-label">
        Number
        <input class="form-control" name="number" type="number" min="1" required>
      </label>
      <button class="btn btn-primary">
        Search
      </button>
    </form>
    <p id="error" class="text-danger">
    </p>
    <table class="table">
      <thead>
        <tr>
          <th>
            Type
          </th>
          <th>
            Brand
          </th>
          <th>
            Price
          </th>
          <th>
            Number
          </th>
          <th>
            Stock
          </th>
        </tr>
      </thead>
      <tbody id="results">
      </tbody>
    </table>
    <script src="task05.js">
    </script>
  </body>
</html>
